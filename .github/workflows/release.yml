name: Build installers

# Run by hand from the Actions tab, or by pushing a tag such as v0.2.0.
# PyInstaller cannot cross-build, so each installer is built on its own OS.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Actions are pinned to exact commits: a moved tag cannot change what builds the installers.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # Windows 10/11, 64-bit
          - os: macos-latest        # Apple Silicon
          - os: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.7.1 -y --no-progress }
      - run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums, so staff can check a download was not changed
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - name: Draft a release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installers/* --repo "${{ github.repository }}" --draft --title "NGO Privacy Helper ${{ github.ref_name }}" --notes "Installers for Windows and macOS."
