name: Build installers

# Run by hand from the Actions tab, or by pushing a tag such as v0.2.0.
# PyInstaller cannot cross-build, so each installer is built on its own OS.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Actions are pinned to exact commits: a moved tag cannot change what builds the installers.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # Windows 10/11, 64-bit
          - os: macos-latest        # Apple Silicon
          - os: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true      # newest 3.12 security release, not the runner's cached copy
      - run: python -m pip install -r requirements-dev.txt
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q tests
        env:
          # Windows' offscreen mode has no fonts, so PDFs would come out with no text; test what staff get.
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.7.1 -y --no-progress }
      - run: python packaging/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Checksums, so staff can check a download was not changed
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - name: Draft a release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installers/* --repo "${{ github.repository }}" --draft --title "NGO Privacy Helper ${{ github.ref_name }}" --notes "Installers for Windows and macOS."
