name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, so newly published vulnerabilities are caught without a push

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          check-latest: true      # newest 3.12 security release, not the runner's cached copy
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (style and security rules)
        run: python -m ruff check .
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
      - name: App imports cleanly
        run: python -c "import privacy_helper.app"
        env:
          QT_QPA_PLATFORM: offscreen
      # Development happens on a Mac, so keep a picture of every page as Windows draws it.
      - name: Screenshots of every page
        if: runner.os == 'Windows'
        run: python packaging/screenshots.py screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-screenshots
          path: screenshots
